/* ---------- Timezone-aware calendar arithmetic ---------- */
function tzParts(ms, tz) {

}
// Convert a wall-clock time in tz to a UTC instant. DST gap -> shifts forward; overlap -> earlier offset (Temporal "compatible").
function wallToUtc(y, m, d, h, mi, s, tz) {

}

/* ---------- VIN rules ---------- */
const VIN_CHARS = 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789';
const VIN_TRANS = { A: 1, B: 2, C: 3, D: 4, E: 5, F: 6, G: 7, H: 8, J: 1, K: 2, L: 3, M: 4, N: 5, P: 7, R: 9, S: 2, T: 3, U: 4, V: 5, W: 6, X: 7, Y: 8, Z: 9 };
const VIN_W = [8, 7, 6, 5, 4, 3, 2, 10, 0, 9, 8, 7, 6, 5, 4, 3, 2];
function vinCheck(v) { let s = 0; for (let i = 0; i < 17; i++) { const c = v[i]; const n = /\d/.test(c) ? +c : VIN_TRANS[c]; s += n * VIN_W[i]; } const r = s % 11; return r === 10 ? 'X' : String(r); }
function makeVin(prefix, serialNum) { // prefix 8 chars WMI+VDS, then check, year S (2025)/T(2026), plant, serial
  let v = (prefix + '0' + 'T' + 'N' + pad(serialNum, 6)).toUpperCase();
  return v.slice(0, 8) + vinCheck(v) + v.slice(9);
}
function validateId(raw, type = 'VIN') {
  const v = String(raw || '').trim().toUpperCase();
  if (!v) return { ok: false, code: 'BLANK', msg: 'Identifier is blank' };
  if (type !== 'VIN') return /^[A-Z0-9-]{4,30}$/.test(v) ? { ok: true, code: 'SERIAL_OK', msg: 'Non-VIN serial accepted under heavy-equipment identifier policy (no check digit applied)' } : { ok: false, code: 'SERIAL_BAD', msg: 'Serial contains unsupported characters' };
  if (v.length !== 17) return { ok: false, code: 'LENGTH', msg: `VIN must be 17 characters (got ${v.length})` };
  if (/[IOQ]/.test(v)) return { ok: false, code: 'PROHIBITED_CHAR', msg: 'VIN contains prohibited letter I, O or Q' };
  if (!/^[A-Z0-9]{17}$/.test(v)) return { ok: false, code: 'CHARS', msg: 'VIN contains invalid characters' };
  const cd = vinCheck(v); if (v[8] !== cd) return { ok: false, code: 'CHECK_DIGIT', msg: `Check digit mismatch (position 9 is ${v[8]}, expected ${cd})` };
  return { ok: true, code: 'OK', msg: 'Valid North American VIN structure and check digit' };
}

/* ---------- RFC4180 CSV parser ---------- */
function parseCSV(text, { maxRows = 5000 } = {}) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = '', q = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; if (rows.length > maxRows + 1) throw new Error(`File exceeds ${maxRows} row limit`); }
    else f += c;
    i++;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const clean = rows.filter(r => r.some(x => x.trim() !== ''));
  if (!clean.length) return { headers: [], records: [] };
  const headers = clean[0].map(h => h.trim());
  return { headers, records: clean.slice(1).map((r, idx) => ({ __row: idx + 2, ...Object.fromEntries(headers.map((h, j) => [h, (r[j] ?? '').trim()])) })) };
}
function csvCell(v) { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
const toCSV = (cols, rows) => [cols.map(c => csvCell(c.label)).join(','), ...rows.map(r => cols.map(c => csvCell(typeof c.csv === 'function' ? c.csv(r) : r[c.key])).join(','))].join('\r\n');

/* ---------- Minimal ZIP (store, no compression) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

async function makeZip(files) { // files: [{name, data: string|Uint8Array|Blob}]
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  for (const f of files) {
    let d = f.data; if (d instanceof Blob) d = new Uint8Array(await d.arrayBuffer()); else if (typeof d === 'string') d = enc.encode(d);
    const nm = enc.encode(f.name), crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(8, 0, true); h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, d);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm); off += 30 + nm.length + d.length;
  }
  const csize = sum(central, x => x.length);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' });
}

/* ---------- IndexedDB blob store for photos/evidence ---------- */
const IDB = {
  db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((res, rej) => { if (!CAP.idb) return rej(new Error('IndexedDB unavailable')); const r = indexedDB.open('drivecommand-evidence', 1); r.onupgradeneeded = () => r.result.createObjectStore('blobs'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async put(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('blobs', 'readwrite'); t.objectStore('blobs').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('blobs').objectStore('blobs').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async clear() { const db = await this.open(); return new Promise(res => { const t = db.transaction('blobs', 'readwrite'); t.objectStore('blobs').clear(); t.oncomplete = res; }); },
};

async function putBlob(k, b) { try { await IDB.put(k, b); return 'idb'; } catch { MEM_BLOBS[k] = b; return 'memory'; } }

}

/* ===================== CLAIM CALCULATIONS (single source of truth) ===================== */
function claimCalc(c, at = now()) {
  const tz = c.policy.tz; const nowT = Date.parse(at);
  const decided = c.lines.every(l => l.approvedCents != null);
  const approved = sum(c.lines, l => l.approvedCents || 0);
  const qual = S.payments.filter(p => p.claimId === c.id && p.status === 'Succeeded' && p.finAck && !p.reversedAt && Date.parse(p.effectiveAt) <= nowT).sort((a, b) => a.effectiveAt.localeCompare(b.effectiveAt));
  const paid = sum(qual, p => p.cents);
  let fullPaidAt = null; if (decided && approved > 0) { let run = 0; for (const p of qual) { run += p.cents; if (run >= approved) { fullPaidAt = p.effectiveAt; break; } } }
  const balance = decided ? Math.max(0, approved - paid) : null;
  const daysSince = calDaysBetween(c.submittedAt, at, tz);
  const daysLeft = calDaysBetween(at, c.dueAt, tz) - (nowT > Date.parse(c.dueAt) && calDaysBetween(at, c.dueAt, tz) === 0 ? 1 : 0);
  const settled = decided && ((approved > 0 && fullPaidAt) || approved === 0);
  const overdue = !c.withdrawn && !(decided && approved === 0) && !fullPaidAt && nowT > Date.parse(c.dueAt);
  let bucket;
  if (c.dataIssue) bucket = 'Data issue';
  else if (c.withdrawn && paid === 0) bucket = 'Withdrawn, no payment';
  else if (decided && approved === 0 && paid === 0) bucket = 'Denied, no payment';
  else if (fullPaidAt && Date.parse(fullPaidAt) <= Date.parse(c.dueAt) && !(c.reopened && !decided)) bucket = 'Fully paid by original deadline';
  else if (fullPaidAt && !(c.reopened && !decided)) bucket = 'Fully paid late';
  else if (nowT <= Date.parse(c.dueAt)) bucket = 'Not yet due';
  else bucket = 'Unpaid / partially paid after deadline';
  const rec = S.recoveries.find(r => r.claimId === c.id) || { receipts: [] };
  const recovered = sum(rec.receipts, r => r.cents);
  const realizedRetained = paid + (c.repairVendorCents || 0) + (c.expensesCents || 0) - recovered;
  const remainingObligation = decided ? balance : Math.max(0, c.reserveCents || 0);
  const expectedRemainingRecovery = Math.max(0, (rec.expectedCents || 0) - recovered);
  const estRemainingExposure = Math.max(0, remainingObligation - expectedRemainingRecovery);
  const escalationDay = [...(polOf(c.account)?.escalations || [])].reverse().find(d => daysSince >= d) || null;
  return { decided, approved, paid, balance, fullPaidAt, daysSince, daysLeft, overdue, settled, bucket, recovered, rec, realizedRetained, estRemainingExposure, remainingObligation, expectedRemainingRecovery, escalationDay, onTime: bucket === 'Fully paid by original deadline' };
}

/* Generic data table: sort, search, paginate, column choice, CSV export (scoped rows only) */
const TABLES = {};
function table(id, cols, rows, { pageSize = 15, search = true, exportName = null, empty = 'No records match these filters.', bulk = null } = {}) {
  const st = TABLES[id] = TABLES[id] || { page: 0, sort: null, dir: 1, q: '', hidden: [], sel: new Set() };
  st.cols = cols; st.rows = rows; st.opts = { pageSize, search, exportName, empty, bulk };
  return `<div class="tbl-wrap" data-table="${id}">${renderTableInner(id)}</div>`;
}
function renderTableInner(id) {
  const st = TABLES[id]; const { cols, opts } = st; let rows = st.rows;
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => cols.some(c => String(c.csv ? c.csv(r) : r[c.key] ?? '').toLowerCase().includes(q))); }
  if (st.sort) { const c = cols.find(c => c.key === st.sort); const v = r => c.sortv ? c.sortv(r) : (c.csv ? c.csv(r) : r[c.key]); rows = [...rows].sort((a, b) => { const x = v(a), y = v(b); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; }); }
  st.filtered = rows; const pages = Math.max(1, Math.ceil(rows.length / opts.pageSize)); st.page = Math.min(st.page, pages - 1);
  const vis = cols.filter(c => !st.hidden.includes(c.key)); const slice = rows.slice(st.page * opts.pageSize, (st.page + 1) * opts.pageSize);
  return `<div class="tbl-tools">${opts.search ? `<input type="search" class="tq" placeholder="Filter rows" aria-label="Filter table rows" value="${esc(st.q)}">` : ''}<span class="muted">${rows.length} row${rows.length === 1 ? '' : 's'}</span><span class="grow"></span>
  ${opts.bulk ? `<span class="muted">${st.sel.size} selected</span>${opts.bulk.map((b, i) => `<button class="btn sm" data-bulk="${i}" ${st.sel.size ? '' : 'disabled'}>${esc(b.label)}</button>`).join('')}` : ''}
  <details class="colpick"><summary class="btn sm">Columns</summary><div>${cols.map(c => `<label><input type="checkbox" data-col="${c.key}" ${st.hidden.includes(c.key) ? '' : 'checked'}> ${esc(c.label)}</label>`).join('')}</div></details>
  ${opts.exportName ? `<button class="btn sm" data-export>Export CSV</button>` : ''}</div>
  <div class="tbl-scroll"><table><thead><tr>${opts.bulk ? '<th><span class="sr">Select</span></th>' : ''}${vis.map(c => `<th scope="col"><button class="th" data-sort="${c.key}">${esc(c.label)}${st.sort === c.key ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('')}</tr></thead>
  <tbody>${slice.length ? slice.map(r => `<tr>${opts.bulk ? `<td><input type="checkbox" data-sel="${esc(r.id)}" ${st.sel.has(r.id) ? 'checked' : ''} aria-label="Select ${esc(r.id)}"></td>` : ''}${vis.map(c => `<td class="${c.cls || ''}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${vis.length + 1}" class="empty">${esc(opts.empty)}</td></tr>`}</tbody></table></div>
  ${pages > 1 ? `<div class="pager"><button class="btn sm" data-pg="-1" ${st.page ? '' : 'disabled'}>Previous</button><span>Page ${st.page + 1} of ${pages}</span><button class="btn sm" data-pg="1" ${st.page < pages - 1 ? '' : 'disabled'}>Next</button></div>` : ''}`;
}
document.addEventListener('click', e => {
  const w = e.target.closest('[data-table]'); if (!w) return; const id = w.dataset.table; const st = TABLES[id];
  const s = e.target.closest('[data-sort]'); if (s) { st.dir = st.sort === s.dataset.sort ? -st.dir : 1; st.sort = s.dataset.sort; w.innerHTML = renderTableInner(id); return; }

  if (e.target.closest('[data-export]')) { const vis = st.cols.filter(c => !st.hidden.includes(c.key)); download(`${st.opts.exportName}_${now().slice(0, 10)}.csv`, `# Demo data export, cutoff ${now()}, exported by ${P().name}, scope ${P().title}\r\n` + toCSV(vis, st.filtered)); audit('Export CSV', st.opts.exportName, `${st.filtered.length} rows`); return; }

/* ---------- Charts (SVG, with table alternative) ---------- */
function barChart(labels, series, { h = 220, stacked = false, fmt = v => v, title = '' } = {}) {
  const W = 640, pad = { l: 44, r: 10, t: 12, b: 48 }; const n = labels.length;
  const totals = labels.map((_, i) => stacked ? sum(series, s => s.values[i]) : Math.max(...series.map(s => s.values[i])));
  const max = Math.max(1, ...totals); const bw = (W - pad.l - pad.r) / Math.max(1, n); const colors = ['#0D5CAB', '#8DC63F', '#E0A106', '#5B6B7C', '#C62828', '#6A8DB5', '#9AA7B4'];
  let bars = '';
  labels.forEach((lb, i) => { let y0 = h - pad.b; series.forEach((s, j) => { const v = s.values[i] || 0; const bh = (h - pad.t - pad.b) * v / max; const x = pad.l + i * bw + (stacked ? bw * 0.18 : bw * 0.12 + j * (bw * 0.76 / series.length)); const w = stacked ? bw * 0.64 : bw * 0.76 / series.length; const y = stacked ? y0 - bh : h - pad.b - bh; bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, w - 2).toFixed(1)}" height="${bh.toFixed(1)}" fill="${s.color || colors[j % 7]}"><title>${esc(lb)} — ${esc(s.name)}: ${esc(fmt(v))}</title></rect>`; if (stacked) y0 -= bh; }); const words = String(lb).split(' '); const l1 = [], l2 = []; words.forEach(w => ((l1.join(' ') + ' ' + w).length <= 16 && !l2.length ? l1 : l2).push(w)); bars += `<text x="${(pad.l + i * bw + bw / 2).toFixed(1)}" y="${h - pad.b + 14}" text-anchor="middle" class="ax"><tspan>${esc(l1.join(' '))}</tspan>${l2.length ? `<tspan x="${(pad.l + i * bw + bw / 2).toFixed(1)}" dy="12">${esc(l2.join(' ').slice(0, 18))}</tspan>` : ''}</text>`; });
  const grid = [0, 0.5, 1].map(f => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${h - pad.b - (h - pad.t - pad.b) * f}" y2="${h - pad.b - (h - pad.t - pad.b) * f}" class="grid"/><text x="${pad.l - 6}" y="${h - pad.b - (h - pad.t - pad.b) * f + 4}" text-anchor="end" class="ax">${esc(fmt(Math.round(max * f)))}</text>`).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map((s, j) => `<span><i style="background:${s.color || colors[j % 7]}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  const alt = `<details class="alt"><summary>View chart data as table</summary><table><thead><tr><th>${esc(title || 'Category')}</th>${series.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${labels.map((l, i) => `<tr><td>${esc(l)}</td>${series.map(s => `<td>${esc(fmt(s.values[i]))}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title || 'Bar chart')}">${grid}${bars}</svg>${legend}${alt}</figure>`;
}

/* ---------- Geographic schematic map ---------- */
function geoMap(points, routes = [], { h = 300, sel = null } = {}) {
  const W = 640; const lon0 = -95.5, lon1 = -78.5, lat0 = 35.5, lat1 = 44; const X = lon => ((lon - lon0) / (lon1 - lon0)) * W, Y = lat => h - ((lat - lat0) / (lat1 - lat0)) * h;
  const grid = [...Array(8)].map((_, i) => `<line x1="${i * W / 7}" x2="${i * W / 7}" y1="0" y2="${h}" class="grid"/>`).join('') + [...Array(5)].map((_, i) => `<line y1="${i * h / 4}" y2="${i * h / 4}" x1="0" x2="${W}" class="grid"/>`).join('');
  const lakes = `<path d="M${X(-87.9)},${Y(41.7)} L${X(-87.6)},${Y(43.3)} L${X(-87.2)},${Y(44)} L${X(-86.3)},${Y(44)} L${X(-86.6)},${Y(42.4)} Z" class="lake"/><path d="M${X(-83.5)},${Y(41.7)} L${X(-81)},${Y(41.9)} L${X(-79)},${Y(42.8)} L${X(-79.5)},${Y(42.9)} L${X(-82.5)},${Y(42.3)} Z" class="lake"/>`;
  const r = routes.map(rt => `<line x1="${X(rt.a.lon)}" y1="${Y(rt.a.lat)}" x2="${X(rt.b.lon)}" y2="${Y(rt.b.lat)}" class="route ${rt.id === sel ? 'sel' : ''}" data-route="${esc(rt.id)}" stroke-width="${Math.min(6, 1 + (rt.w || 1) / 4)}"><title>${esc(rt.label || '')}</title></line>`).join('');
  const p = points.map(pt => `<g class="pt ${pt.kind || ''}" ${pt.link ? `data-link="${esc(pt.link)}"` : ''}><circle cx="${X(pt.lon)}" cy="${Y(pt.lat)}" r="${pt.r || 5}"/><text x="${X(pt.lon) + 7}" y="${Y(pt.lat) + 4}">${esc(pt.label)}</text><title>${esc(pt.title || pt.label)}</title></g>`).join('');
  return `<figure class="map"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Schematic map of origins, destinations and routes">${grid}${lakes}${r}${p}</svg><figcaption>Schematic straight-line routes on approximate coordinates. Not navigation, not real drive times.</figcaption></figure>`;
}

/* ===================== SELECTORS FOR DASHBOARDS ===================== */
function moveStats(moves) {
  const T = nowMs(); const del = moves.filter(m => m.actualDelivery);
  const withCommit = del.filter(m => m.committedDeliveryEnd);
  const onTime = withCommit.filter(m => Date.parse(m.actualDelivery) <= Date.parse(m.committedDeliveryEnd));
  const openOver = moves.filter(m => !m.actualDelivery && m.committedDeliveryEnd && Date.parse(m.committedDeliveryEnd) < T);
  const stale = moves.filter(m => m.lastPing && !m.actualDelivery && (T - Date.parse(m.lastPing.at)) > 4 * 3600000);
  return { total: moves.length, atYard: moves.filter(m => m.status === 'at_yard').length, inTransit: moves.filter(m => ['in_transit', 'arrived'].includes(m.status)).length, delivered: del.length, onTime: onTime.length, withCommit: withCommit.length, openOver: openOver.length, stale: stale.length, missingPod: moves.filter(m => m.pod === 'Missing').length };
}
function evidenceStats(moves) { let req = 0, sat = 0; const ids = new Set(moves.map(m => m.id)); moves.forEach(m => { const stages = m.actualDelivery ? 2 : m.actualPickup ? 1 : 0; req += stages * 6; }); S.inspections.filter(i => ids.has(i.movementId) && /Driver/.test(i.stage)).forEach(i => sat += Math.min(6, i.photos.length)); return { req, sat }; }
function claimTotals(claims) { const cs = claims.map(c => ({ c, k: claimCalc(c) })); return { n: claims.length, open: cs.filter(x => !x.k.settled && !x.c.withdrawn).length, claimed: sum(cs, x => x.c.claimedCents), approved: sum(cs, x => x.k.approved), paid: sum(cs, x => x.k.paid), recovered: sum(cs, x => x.k.recovered), reserve: sum(cs, x => x.k.decided ? 0 : x.c.reserveCents), recvRecv: sum(cs, x => Math.max(0, x.k.rec.demandedCents - x.k.recovered - (x.k.rec.writeOffCents || 0))), exposure: sum(cs, x => x.k.estRemainingExposure), overdue: cs.filter(x => x.k.overdue).length, due10: cs.filter(x => !x.k.overdue && !x.k.settled && x.k.daysLeft <= 10).length, cs }; }

function claimMiniTable(claims) {

function clockBadge(c) { const k = claimCalc(c); if (c.provisional) return badge('Provisional — awaiting receipt', 'amber'); if (k.bucket.startsWith('Fully paid')) return badge(k.bucket === 'Fully paid by original deadline' ? 'Paid on time' : 'Paid late', k.bucket === 'Fully paid late' ? 'amber' : 'green'); if (k.bucket.startsWith('Denied')) return badge('Denied', 'blue'); if (k.overdue) return badge(`Overdue ${-k.daysLeft + 1 > 0 ? Math.abs(Math.floor((nowMs() - Date.parse(c.dueAt)) / DAY)) + 'd' : ''}`, 'red'); return badge(`${k.daysLeft} days left`, k.daysLeft <= 10 ? 'amber' : 'blue'); }
function networkMap(moves) {
  const byDest = groupBy(moves, m => m.dest); const pts = S.facilities.filter(f => byDest[f.id] || ['FAC-NRM', 'YRD-BLM'].includes(f.id)).map(f => ({ lat: f.lat, lon: f.lon, label: f.city.split(',')[0], title: `${f.name}: ${(byDest[f.id] || []).length} VIN movements`, kind: f.kind, r: f.kind === 'dealer' ? 3 + Math.min(6, (byDest[f.id] || []).length / 6) : 6 }));
  const o = fac('YRD-BLM'); const routes = Object.entries(byDest).map(([d, ms]) => ({ id: d, a: o, b: fac(d), w: ms.length, label: `${fac(d).name}: ${ms.length} movements` })).filter(r => r.b.lat);
  return geoMap(pts, routes);
}
function commercialSummary() {
  const del = S.movements.filter(m => m.actualDelivery && scopeMove(m)); const rev = del.length * 38000; const cost = del.length * 32200; const gp = rev - cost;

}

const ADAPTER = { failNext: false, delay: 700 };
function mockCall(name, payload, { idemKey, failMsg = 'Sunnybrook rejected the command: lane code not mapped (simulated)' } = {}) {
  return new Promise(res => setTimeout(() => {
    if (idemKey && S.idem[idemKey]) return res({ ok: true, duplicate: true, id: S.idem[idemKey + ':id'] });
    if (ADAPTER.failNext) { ADAPTER.failNext = false; S.intEvents.unshift({ id: 'IE-' + (++S.seq), conn: 'SB', type: name, ext: '—', corr: 'c-' + S.seq, idem: idemKey, occurredAt: now(), receivedAt: now(), outcome: 'Failed: ' + failMsg }); return res({ ok: false, retryable: true, error: failMsg }); }
    const id = 'SB-' + (90000 + S.seq++); if (idemKey) { S.idem[idemKey] = now(); S.idem[idemKey + ':id'] = id; }
    S.intEvents.unshift({ id: 'IE-' + (++S.seq), conn: 'SB', type: name, ext: id, corr: 'c-' + S.seq, idem: idemKey, occurredAt: now(), receivedAt: now(), outcome: 'Acknowledged by Sunnybrook (mock)' });
    res({ ok: true, id });
  }, ADAPTER.delay));
}

document.addEventListener('change', e => { if (e.target.id === 'failnext') ADAPTER.failNext = e.target.checked; });

function planValidate() {
  const all = S.planTrips.flatMap(t => t.vins); const dup = all.filter((v, i) => all.indexOf(v) !== i);
  const ready = new Set(S.releaseRows.filter(r => r.status === 'ready' && r.row && !r.corrections).map(r => r.vin));
  const bad = all.filter(v => !S.releaseRows.some(r => r.vin === v && r.status === 'ready'));
  const over = S.planTrips.filter(t => t.vins.length > EQUIP[t.equipment].cap);
  const inop = S.planTrips.filter(t => t.vins.some(v => /Inop/i.test(S.releaseRows.find(r => r.vin === v)?.operability || '')) && !EQUIP[t.equipment].inop);

function scenarioCalc(kind) {
  const base = S.planTrips.filter(t => t.vins.length); const miles = sum(base, t => 180 + CLUSTERS.findIndex(c => c.id === t.cluster) * 45);

  return { trips: base.length, vins: sum(base, t => t.vins.length), miles, empty: Math.round(miles * (0.22 * f[1])), util: pct(sum(base, t => t.vins.length), sum(base, t => EQUIP[t.equipment].cap)), cost, rev, margin: pct(rev - cost, rev), onTimeConf: kind === 'service' ? 'High' : kind === 'risk' ? 'Medium-high' : 'Medium', claimRisk: (sum(base, t => carrierOf(t.candidateCarrier).dmgPer100 * t.vins.length) / Math.max(1, sum(base, t => t.vins.length)) * f[2]).toFixed(2) };
}

function custodyAnalysis(m) {
  const evs = S.events.filter(e => e.movementId === m.id).sort((a, b) => a.occurredAt.localeCompare(b.occurredAt)); const ins = S.inspections.filter(i => i.movementId === m.id);
  const gaps = [];
  if (!m.yardFeed) gaps.push('No yard condition record available (feed unavailable) — not the same as “no damage”.');
  ins.forEach(i => { if (i.exception) gaps.push(`${i.stage}: ${i.exception}`); if (/Driver/.test(i.stage) && i.photos.length < 6 && !i.exception) gaps.push(`${i.stage}: ${i.photos.length}/6 required photos`); });
  if (m.actualDelivery && !ins.some(i => /delivery/i.test(i.stage))) gaps.push('Delivery inspection missing.');
  evs.forEach(e => { if (/one-sided/.test(e.ack || '')) gaps.push(`${e.type}: one-sided acknowledgment (other party has not confirmed).`); if (Date.parse(e.receivedAt) - Date.parse(e.occurredAt) > 12 * 3600000) gaps.push(`${e.type}: reported ${Math.round((Date.parse(e.receivedAt) - Date.parse(e.occurredAt)) / 3600000)} h after it occurred (late upload).`); });
  if (m.pod === 'Missing') gaps.push('Delivered but proof of delivery is missing.');
  ins.forEach(i => i.lines.forEach(l => { if (l.mapping === 'UNMAPPED') gaps.push(`${i.stage}: yard code ${l.sourceCode} is unmapped — human review required.`); }));
  const seq = ['Yard (prior condition)', 'Driver pickup', 'Transfer', 'Driver delivery / dealer receipt', 'Post-delivery'];
  const firstSeen = {}; ins.sort((a, b) => seq.indexOf(a.stage) - seq.indexOf(b.stage)).forEach(i => i.lines.forEach(l => { const k = `${l.area}|${l.type}`; if (l.area && !firstSeen[k]) firstSeen[k] = i.stage; }));
  return { evs, ins, gaps, firstSeen };
}

      c.customerStage = approvedAll === 0 ? 'Denied with explanation' : needs2 ? 'Decision' : 'Payment pending'; c.internalStage = needs2 ? 'Awaiting four-eyes approval' : approvedAll ? 'Settlement approved — awaiting payment' : 'Closed';
      if (c.reopened && c.lines.every(l => l.approvedCents != null)) c.reopened = false;
      H(`Decision: ${money(tot)} approved on this pass${needs2 ? ' (routed to second approver)' : ''}`); };
    on('#apr2', () => { if (c.decision.by === P().name) return toast('Separation of duties: the decision maker cannot be the second approver.', 'err'); c.decision.pendingSecond = false; c.decision.approver2 = P().name; c.customerStage = 'Payment pending'; c.internalStage = 'Settlement approved — awaiting payment'; H('Second approval recorded'); });
    on('#payrec', () => { const k = claimCalc(c); const cents = Math.round(+$('#payamt').value * 100); if (!cents || cents > (k.balance || 0)) return toast('Amount must be positive and no more than the approved balance.', 'err'); if (!idem(`pay-${c.id}-${k.paid}-${cents}`)) return toast('Duplicate payment event ignored.', 'warn'); S.payments.push({ id: 'PAY-' + (++S.seq), claimId: c.id, cents, currency: 'USD', status: 'Succeeded', effectiveAt: now(), ref: 'FIN-DEMO-' + S.seq, finAck: true, recordedBy: P().name, reversedAt: null }); const k2 = claimCalc(c); if (k2.balance === 0) { c.customerStage = 'Paid/closed'; c.internalStage = k2.rec.state === 'Recovered' ? 'Closed' : 'Recovery pending'; } H(`Demo payment recorded ${money(cents)} (finance acknowledged)`); });
    on('#payfail', () => { S.payments.push({ id: 'PAY-' + (++S.seq), claimId: c.id, cents: Math.round(+$('#payamt').value * 100), currency: 'USD', status: 'Failed', effectiveAt: now(), ref: 'FIN-DEMO-' + S.seq, finAck: true, failReason: 'Rejected by bank (simulated)', reversedAt: null }); H('Failed payment attempt recorded (does not count as paid)'); });
    on('#payrev', () => { const p = S.payments.filter(x => x.claimId === c.id && x.status === 'Succeeded' && !x.reversedAt).at(-1); p.reversedAt = now(); p.reverseReason = 'Reversal (demo)'; c.customerStage = 'Payment pending'; H(`Payment ${p.id} reversed — balance restored; original deadline unchanged`); });
    const r = S.recoveries.find(x => x.claimId === c.id);
    on('#rdem', () => { const k = claimCalc(c); r.demandedCents = k.approved || c.claimedCents; r.expectedCents = r.demandedCents; r.state = 'Demand sent'; r.dueAt = new Date(nowMs() + 30 * DAY).toISOString(); r.history.push({ at: now(), what: 'Demand sent (simulated)' }); H('Recovery demand sent (simulated)'); });
    on('#rrec', () => { const cents = Math.round(+$('#ramt').value * 100); if (!cents) return toast('Enter an amount.', 'err'); r.receipts.push({ cents, at: now(), ref: 'RCV-DEMO-' + (++S.seq) }); const got = sum(r.receipts, x => x.cents); r.state = got >= r.demandedCents ? 'Recovered' : 'Partially recovered'; H(`Recovery receipt ${money(cents)} recorded (customer payment unchanged)`); });
    on('#rdisp', () => { r.state = 'Disputed by carrier'; r.history.push({ at: now(), what: 'Carrier disputed' }); H('Carrier dispute recorded'); });
    on('#rwo', () => { const rem = r.demandedCents - sum(r.receipts, x => x.cents) - r.writeOffCents; const why = prompt('Write-off reason (recovery only — customer balance is unaffected)'); if (!why || rem <= 0) return; r.writeOffCents += rem; r.state = 'Written off'; r.history.push({ at: now(), what: `Write-off ${money(rem)}: ${why}` }); H('Recovery write-off approved'); });
    const cd = $('#cdoc'); if (cd) cd.onchange = async e => { const f = e.target.files[0]; if (!f) return; if (f.size > 20e6) return toast('Max 20 MB.', 'err'); const k = `doc-${c.id}-${++S.seq}`; await putBlob(k, f); c.docs = c.docs || []; c.docs.push({ id: k, name: f.name, type: /estimate/i.test(f.name) ? 'Repair estimate' : 'Document', blobKey: k, size: f.size, uploadedAt: now(), by: P().name, audience: isInternal() ? 'BHD-only' : 'shared', hash: await sha256(f) }); if (/estimate/i.test(f.name)) c.missing = c.missing.filter(x => x !== 'Repair estimate'); H('Document uploaded: ' + f.name); };
    $$('[data-dl]').forEach(b => b.onclick = async () => { const bl = await getBlob(b.dataset.dl); bl ? download(b.dataset.name, bl) : toast('Blob not on this device.', 'err'); });
  }
};

function packetHtml(o, aud) {
  const internal = aud === 'internal', recovery = aud === 'recovery';
  const c = o.claimId ? S.claims.find(x => x.id === o.claimId) : null; const m = S.movements.find(x => x.id === (c ? c.movementId : o.movementId)); const A = custodyAnalysis(m); const k = c ? claimCalc(c) : null;
  const excluded = aud === 'customer' ? ['Reserves', 'Recovery strategy and demands', 'Carrier buy rates / margin', 'BHD-only notes', 'Internal liability discussion'] : recovery ? ['Customer sell rate', 'Reserves', 'BHD-only notes', 'Other customers\' data'] : ['Nothing — internal audience'];
  return `<article class="packet"><header><img src="${LOGO}" alt="BHDrive" style="height:36px"><div><h1>${c ? 'Claim packet ' + esc(c.id) : 'Shipment packet ' + esc(m.id)}</h1><p>Audience: <strong>${esc({ customer: 'Customer-safe', recovery: 'Carrier recovery', internal: 'Internal' }[aud])}</strong> • generated ${fmtDT(new Date().toISOString())} by ${esc(P().name)} • reference clock ${esc(now())} • DEMO DATA</p></div></header>
  <h2>Identifiers</h2><table><tr><th>VIN</th><td>${esc(m.vin)}</td><th>Movement</th><td>${esc(m.id)}</td></tr><tr><th>Release</th><td>${esc(m.release)}</td><th>Sunnybrook load</th><td>${esc(m.sunnybrookLoad)}</td></tr><tr><th>BOL</th><td>${esc(m.bol)} (specimen)</td><th>POD</th><td>${esc(m.pod)}</td></tr></table>
  ${c ? `<h2>Claim summary</h2><table><tr><th>Submitted</th><td>${fmtDT(c.submittedAt, c.policy.tz)}</td><th>Original pay-by</th><td>${fmtDT(c.dueAt, c.policy.tz)}</td></tr><tr><th>Claimed</th><td>${money(c.claimedCents)}</td><th>Approved</th><td>${k.decided ? money(k.approved) : 'Pending'}</td></tr><tr><th>Paid</th><td>${money(k.paid)}</td><th>Stage</th><td>${esc(c.customerStage)}</td></tr>${internal ? `<tr><th>Reserve</th><td>${money(c.reserveCents)}</td><th>Recovery</th><td>${esc(k.rec.state)} • demanded ${money(k.rec.demandedCents)} • recovered ${money(k.recovered)}</td></tr>` : ''}${recovery ? `<tr><th>Recovery demand</th><td colspan="3">${money(k.rec.demandedCents || k.approved)} against ${esc(carrierOf(m.carrier).name)}</td></tr>` : ''}</table>
  <h2>Damage lines (DEMO code dictionary DEMO-2026.1)</h2><table><tr><th>Area</th><th>Type</th><th>Severity</th><th>Code</th><th>Decision</th></tr>${c.lines.map(l => `<tr><td>${esc(l.area)}</td><td>${esc(l.type)}</td><td>${esc(l.severity)}</td><td>${esc(l.code)}</td><td>${esc(l.decision)}</td></tr>`).join('')}</table>${c.decision ? `<p>Decision: ${esc(c.decision.reason)}</p>` : ''}` : ''}
  <h2>Custody timeline</h2><table><tr><th>Event</th><th>Occurred</th><th>From → To</th><th>Source</th><th>Acknowledgment</th></tr>${A.evs.map(e => `<tr><td>${esc(e.type)}</td><td>${fmtDT(e.occurredAt)}</td><td>${esc(e.from || '')} → ${esc(e.to || '')}</td><td>${esc(e.source)}</td><td>${esc(e.ack || '')}</td></tr>`).join('')}</table>
  <h2>Inspections and evidence index</h2><table><tr><th>Stage</th><th>Captured / received</th><th>Photos</th><th>Findings</th></tr>${A.ins.map(i => `<tr><td>${esc(i.stage)}</td><td>${fmtDT(i.at)} / ${fmtDT(i.receivedAt)}</td><td>${i.photos.map(p => esc(p.id || p.blobKey) + (p.blobKey ? '' : ' (illustrative)')).join(', ') || 'none'}</td><td>${i.lines.map(l => esc((l.area || 'Unmapped ' + l.sourceCode) + ' ' + (l.type || ''))).join('; ') || (i.noDamageAttested ? 'No damage observed (attested)' : '—')}${i.exception ? ' • ' + esc(i.exception) : ''}</td></tr>`).join('')}</table>
  <h2>Missing evidence</h2><ul>${A.gaps.map(g => `<li>${esc(g)}</li>`).join('') || '<li>None identified</li>'}</ul>
  ${internal ? `<h2>Internal notes</h2><ul>${S.notes.filter(n => n.ref === m.vin || n.ref === c?.id).map(n => `<li>[${esc(n.audience)}] ${esc(n.text)}</li>`).join('') || '<li>None</li>'}</ul>` : ''}
  <footer>Redacted for this audience: ${excluded.map(esc).join(', ')}. Specimen documents; images labeled illustrative are not actual inspection photos. Hashes record file identity only; they do not prove an image is truthful.</footer></article>`;
}
function openPacket(o) {
  const auds = isInternal() ? ['customer', 'recovery', 'internal'] : ['customer'];
  const draw = aud => `<div class="row wrap"><label>Audience<select id="paud">${auds.map(a => `<option value="${a}" ${a === aud ? 'selected' : ''}>${{ customer: 'Customer-safe', recovery: 'Carrier recovery', internal: 'Internal' }[a]}</option>`).join('')}</select></label><button class="btn primary" id="pprint">Print / Save as PDF</button><button class="btn" id="phtml">Download HTML</button><button class="btn" id="pzip">Download ZIP evidence bundle</button>${o.claimId && isInternal() ? '<button class="btn" id="pwar">Prepare warranty handoff</button>' : ''}</div><p class="small muted">PDF output uses your browser's print dialog (“Save as PDF”).</p><div id="pprev" class="pprev">${packetHtml(o, aud)}</div>`;
  let aud = 'customer';
  const bind = m => {
    m.querySelector('#paud').onchange = e => { aud = e.target.value; m.querySelector('.modal-b').innerHTML = draw(aud); bind(m); };
    m.querySelector('#pprint').onclick = () => { $('#print-area').innerHTML = packetHtml(o, aud); audit('Packet printed', o.claimId || o.movementId, aud); window.print(); };
    m.querySelector('#phtml').onclick = () => { download(`packet_${o.claimId || o.movementId}_${aud}.html`, `<!doctype html><meta charset="utf-8"><title>Packet</title><style>body{font:14px system-ui;margin:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px;text-align:left}</style>${packetHtml(o, aud)}`, 'text/html'); audit('Packet exported', o.claimId || o.movementId, aud); };
    m.querySelector('#pzip').onclick = async () => {
      const c = o.claimId ? S.claims.find(x => x.id === o.claimId) : null; const mv = S.movements.find(x => x.id === (c ? c.movementId : o.movementId)); const A = custodyAnalysis(mv);
      const files = [{ name: 'packet.html', data: `<!doctype html><meta charset="utf-8">${packetHtml(o, aud)}` }]; const manifest = { packet: o, audience: aud, generatedAt: new Date().toISOString(), referenceClock: now(), demo: true, files: [] };
      for (const i of A.ins) for (const p of i.photos) { const b = p.blobKey ? await getBlob(p.blobKey) : await illustrativeImage(p.label, mv.vin, i.stage, p.damage ? {} : null); if (!b) continue; const nm = `evidence/${i.stage.replace(/\W+/g, '_')}_${(p.label || '').replace(/\W+/g, '_')}_${(p.id || p.blobKey).slice(-12)}.png`; files.push({ name: nm, data: b }); manifest.files.push({ file: nm, inspection: i.id, stage: i.stage, illustrative: !p.blobKey, sha256: p.hash || null }); }
      if (c && aud !== 'recovery') for (const d of (c.docs || [])) { if (aud === 'customer' && d.audience === 'BHD-only') continue; const b = await getBlob(d.blobKey); if (b) { files.push({ name: 'documents/' + d.name, data: b }); manifest.files.push({ file: 'documents/' + d.name, sha256: d.hash }); } }
      manifest.missingEvidence = A.gaps; files.push({ name: 'manifest.json', data: JSON.stringify(manifest, null, 1) });
      download(`packet_${o.claimId || o.movementId}_${aud}.zip`, await makeZip(files)); audit('ZIP bundle exported', o.claimId || o.movementId, aud + ', ' + files.length + ' files');
    };
    const w = m.querySelector('#pwar'); if (w) w.onclick = () => { const c = S.claims.find(x => x.id === o.claimId); c.history.push({ at: now(), by: P().name, what: 'Warranty handoff packet prepared — manual handoff status: Ready to send (no API transmission)' }); save(); toast('Warranty packet prepared. Handoff status: ready for manual send (simulated).'); };
  };
  modal(o.claimId ? 'Claim packet' : 'Shipment packet', draw(aud), { wide: true, onMount: bind });
}

  const saved = S, savedRender = window.render; window.render = () => { }; TESTING = true; const oldDelay = ADAPTER.delay; ADAPTER.delay = 0;
  const results = []; const T = (id, name, fn) => results.push({ id, name, fn });
  S = clone(saved); const as = k => { S.session.persona = k; S.session.account = PERSONAS[k].scope.accounts ? PERSONAS[k].scope.accounts[0] : 'ALL'; };
  const ok = (c, d) => ({ status: c ? 'PASS' : 'FAIL', detail: d });

    ${R ? `<p>${Object.entries(c).map(([k, v]) => `${badge(k + ': ' + v.length, k === 'PASS' ? 'green' : k === 'FAIL' ? 'red' : 'amber')}`).join(' ')} • run ${fmtDT(R.at)}</p><table><thead><tr><th>ID</th><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>${R.results.map(r => `<tr><td>${r.id}</td><td>${esc(r.name)}</td><td>${statusBadge(r.status)}</td><td class="small">${esc(r.detail)}</td></tr>`).join('')}</tbody></table>` : ''}</section>
    <section class="panel"><h2>Requirement coverage (R00–R39)</h2><table><thead><tr><th>ID</th><th>Requirement</th><th>Status</th><th>Where</th></tr></thead><tbody>${COVERAGE.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${statusBadge(r[2])}</td><td class="small">${esc(r[3])}</td></tr>`).join('')}</tbody></table></section>
    <section class="panel"><h2>Route-to-role matrix</h2><div class="tbl-scroll"><table class="matrix"><thead><tr><th>Route</th>${Object.values(PERSONAS).map(p => `<th>${esc(p.title.split('—')[0])}</th>`).join('')}</tr></thead><tbody>${NAV.map(([k, l, pm]) => `<tr><td>${esc(l)}</td>${Object.values(PERSONAS).map(p => `<td>${!pm || p.perms.includes(pm) ? '●' : ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><h2>Production dependency register</h2><table><thead><tr><th>Dependency</th><th>Owner</th><th>Prototype behavior</th></tr></thead><tbody>${DEPENDENCIES.map(d => `<tr><td>${esc(d)}</td><td>Unassigned</td><td>Simulated with honest failure states</td></tr>`).join('')}</tbody></table></section>
    <section class="panel"><h2>How to run</h2><p>Open <span class="mono">DriveCommand.html</span> in a current Chrome, Edge, Safari or Firefox. No server, build step or network is needed (Google Fonts load when online; system fonts otherwise). State is kept in this browser's localStorage and photos in IndexedDB. Use Demo controls to advance the reference clock, switch persona, export/import the whole store or reset. Mock-to-live: replace <span class="mono">mockCall</span> and the seed adapters with authenticated server calls; keep idempotency keys and correlation IDs. Illustrative images are generated in the browser and are not real inspection photos. The BHDrive logo is the supplied original asset.</p>
    <h3>Known environment limitations</h3><ul class="list"><li>XLSX import is not supported; CSV only.</li><li>Barcode decoding is not implemented; camera capture attaches a photo and the VIN is confirmed manually.</li><li>PDF output uses the browser print dialog.</li><li>Background upload is not provided; sync runs while the page is open.</li><li>All authorization is client-side and demonstrative.</li></ul></section>`;
  },
  mount() { $('#runt').onclick = () => { $('#runt').disabled = true; $('#runt').textContent = 'Running…'; setTimeout(runTests, 30); }; }
};

/* boot */
(function () {
  const origMount = VIEWS.login.mount;
  VIEWS.login.mount = function () { origMount(); $$('.persona').forEach(b => { const k = b.dataset.p; if (S.userAdmin && S.userAdmin[k] === 'Deactivated') { b.disabled = true; b.title = 'Access deactivated by an administrator'; b.querySelector('small').textContent += ' — deactivated'; } }); };
  loadState(); render();
})();
</script>
</body>
</html>
